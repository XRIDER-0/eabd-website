<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EABD Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            margin-bottom: 25px;
            color: #666;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            opacity: 0.9;
        }

        #loginMessage {
            margin-top: 15px;
            color: #c00;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>EABD Admin</h1>

        <p>Sign in to access the admin dashboard.</p>

        <form id="loginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
            >

            <button type="submit">Log In</button>

        </form>

        <p id="loginMessage"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { error } = await eabdSupabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                loginMessage.textContent = error.message;
                return;
            }

            window.location.href = "admin.html";
        });
    </script>

</body>
</html>
