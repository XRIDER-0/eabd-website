<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Support Request | EABD</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="support-request-page">

        <div class="support-request-container">

            <h1>Submit a Support Request</h1>

            <p>
                If you need assistance from EABD, please fill out
                the form below and our team will get back to you.
            </p>


            <form id="supportRequestForm">

                <div class="form-group">

                    <label for="requestName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="requestName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="requestEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="requestEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="requestPhone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="requestPhone"
                        name="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="requestSubject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="requestSubject"
                        name="subject"
                        placeholder="What do you need help with?"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="requestMessage">
                        Message
                    </label>

                    <textarea
                        id="requestMessage"
                        name="message"
                        rows="6"
                        placeholder="Describe your request..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="form-submit"
                >
                    Submit Request
                </button>

            </form>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="support-request.js"></script>

</body>

</html>
